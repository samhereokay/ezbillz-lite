version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezbillz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezbillz_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ezbillz}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezbillz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ezbillz_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ezbillz_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ezbillz:ezbillz_dev_password@postgres:5432/ezbillz}
      DIRECT_URL: ${DIRECT_URL:-postgresql://ezbillz:ezbillz_dev_password@postgres:5432/ezbillz}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/storage-data}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage-data

volumes:
  pg_data:
  minio_data:
  app_storage:
