version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ezbillz
      POSTGRES_REDACTED_SECRET
      POSTGRES_DB: ezbillz
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezbillz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Free, self-hosted S3-compatible storage. Set STORAGE_PROVIDER=S3 and
  # point S3_ENDPOINT at http://localhost:9000 to use it instead of LOCAL.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ezbillz_minio
      MINIO_ROOT_REDACTED_SECRET
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDACTED_SECRET: postgresql://ezbillz:ezbillz_dev_password@postgres:5432/ezbillz
      STORAGE_PROVIDER: LOCAL
      LOCAL_STORAGE_DIR: /app/storage-data
      REDACTED_SECRET: http://localhost:3000
      REDACTED_SECRET: change-me-in-production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage-data

volumes:
  pg_data:
  minio_data:
  app_storage:
