services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezbillz_test_user
      POSTGRES_PASSWORD: ezbillz_test_password
      POSTGRES_DB: ezbillz_test
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezbillz_test_user -d ezbillz_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: test_minio_admin
      MINIO_ROOT_PASSWORD: test_minio_password
    ports:
      - "127.0.0.1:9005:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-storage-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: test_minio_admin
      AWS_SECRET_ACCESS_KEY: test_minio_password
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      test-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://test-minio:9000 s3 mb s3://ezbillz-test-storage || true
      "

  test-runner:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://ezbillz_test_user:ezbillz_test_password@test-postgres:5432/ezbillz_test?schema=public
      - DIRECT_URL=postgresql://ezbillz_test_user:ezbillz_test_password@test-postgres:5432/ezbillz_test?schema=public
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=test-secret-do-not-use-in-prod
      - ENCRYPTION_KEY=test-encryption-key-0123456789ab
      - S3_ENDPOINT=http://test-minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=test_minio_admin
      - S3_SECRET_KEY=test_minio_password
      - S3_BUCKET_NAME=ezbillz-test-storage
    depends_on:
      test-postgres:
        condition: service_healthy
      test-storage-init:
        condition: service_completed_successfully
