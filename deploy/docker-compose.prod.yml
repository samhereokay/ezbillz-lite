version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    networks:
      - internal
    depends_on:
      - app

  postgres:
    ports: !reset []
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    networks:
      - internal

  minio:
    ports: !reset []
    volumes:
      - minio_data_prod:/data
    networks:
      - internal

  # One-shot init container: runs as root, sets ownership on the named
  # volume mount point (uid/gid 1001 = nextjs:nodejs inside the app image),
  # then exits. The main app service waits for this to complete successfully
  # before starting. restart:no prevents re-running on subsequent compose ups
  # unless the service itself is re-created. Idempotent: chown on an
  # already-correct volume is a no-op. Preserves existing data.
  storage-init:
    image: ezbillz-app
    user: root
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /app/storage-data && echo 'storage-data ownership set to 1001:1001'"]
    volumes:
      - app_storage_prod:/app/storage-data
    restart: "no"
    networks:
      - internal

  app:
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - app_storage_prod:/app/storage-data
    networks:
      - internal
    depends_on:
      storage-init:
        condition: service_completed_successfully

networks:
  internal:
    driver: bridge

volumes:
  pg_data_prod:
  minio_data_prod:
  app_storage_prod:
  caddy_data_prod:
  caddy_config_prod:
