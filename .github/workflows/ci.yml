name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start Test Database
        run: |
          docker compose -f test-db-compose.yml up -d
          sleep 5

      - name: Create .env.test
        run: |
          cat << 'EOF' > .env.test
          DATABASE_URL="postgresql://ezbillz_test_user:ezbillz_test_password@127.0.0.1:5435/ezbillz_test?schema=public"
          DIRECT_URL="postgresql://ezbillz_test_user:ezbillz_test_password@127.0.0.1:5435/ezbillz_test?schema=public"
          NEXTAUTH_URL="http://localhost:3001"
          NEXTAUTH_SECRET="test-secret-do-not-use-in-prod"
          ENCRYPTION_KEY="test-encryption-key-0123456789ab"
          S3_ENDPOINT="http://127.0.0.1:9005"
          S3_REGION="us-east-1"
          S3_ACCESS_KEY="test_minio_admin"
          S3_SECRET_KEY="test_minio_password"
          S3_BUCKET_NAME="ezbillz-test-storage"
          EOF

      - name: Test
        run: |
          export $(grep -v '^#' .env.test | xargs)
          node scripts/verify-test-db.js
          npm run test

      - name: Generate SBOM
        run: npm sbom --package-lock-only > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ezbillz-app:latest .
